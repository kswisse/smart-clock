name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simulation:
    name: Simulation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Simulation
        working-directory: firmware
        run: pio run -e simulation

      - name: Run Simulation Tests
        working-directory: firmware
        run: |
          .pio/build/simulation/program
        continue-on-error: false

  lint:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check trailing whitespace
        run: |
          ! grep -rn $'\r' --include='*.cpp' --include='*.h' --include='*.js' firmware/ data/

      - name: Check for TODO/FIXME in production code
        run: |
          echo "Checking for TODO/FIXME markers..."
          grep -rn "TODO\|FIXME\|HACK\|XXX" firmware/src/ --include='*.cpp' --include='*.h' || echo "No TODO markers found (good)"
        continue-on-error: true
