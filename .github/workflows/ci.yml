name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -d firmware -e esp32_s3
      - name: Check JavaScript syntax
        run: find data/js -name '*.js' -print0 | xargs -0 -n1 node --check
