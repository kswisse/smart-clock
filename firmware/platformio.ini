; ──────────────────────────────────────────────────────────────
; PIFKID 2026 Smart Desk Clock — PlatformIO Configuration
; ──────────────────────────────────────────────────────────────

[platformio]
src_dir = .

; ── Production ESP32 Build ──────────────────────────────────
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    bblanchon/ArduinoJson@^6.21.0
    bodmer/TFT_eSPI
build_flags =
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DSPI_FREQUENCY=40000000
    -DASYNCWEBSERVER_REGEX
    -I.
build_src_filter =
    +<main.cpp>
    +<src/**>

; ── Desktop Simulation Build ────────────────────────────────
[env:simulation]
platform = native
build_flags =
    -DSIMULATION
    -Isim
    -Isim/mock_headers
    -std=c++17
    -g
    -lpthread
build_src_filter =
    +<sim_main.cpp>
    +<sim/test_main.cpp>
    +<sim/tests/test_boot.cpp>
    +<sim/tests/test_event_bus.cpp>
    +<sim/tests/test_todo.cpp>
    +<sim/tests/test_alarm.cpp>
    +<sim/tests/test_schedule.cpp>
    +<sim/tests/test_time.cpp>
    +<sim/tests/test_wifi.cpp>
    +<sim/tests/test_api_flow.cpp>
    +<sim/arduino_stubs.cpp>
    +<sim/mock_littlefs.cpp>
    +<sim/mock_hal.cpp>
    +<sim/mock_services.cpp>
    +<sim/mock_headers/ArduinoJson.cpp>
    +<src/core/firmware_info.cpp>
    +<src/events/event_bus.cpp>
    +<src/utils/logger.cpp>
    +<src/utils/json_util.cpp>
    +<src/utils/string_util.cpp>
    +<src/repositories/repository.cpp>
    +<src/repositories/todo_repo.cpp>
    +<src/repositories/alarm_repo.cpp>
    +<src/repositories/schedule_repo.cpp>
    +<src/repositories/config_repo.cpp>
    +<src/services/todo_service.cpp>
    +<src/services/alarm_service.cpp>
    +<src/services/schedule_service.cpp>
    +<src/services/speaker_service.cpp>
    -<src/services/time_service.cpp>
    -<src/services/wifi_service.cpp>
    +<src/services/status_service.cpp>
    -<src/hal/display_hal.cpp>
    +<src/hal/speaker_hal.cpp>
    -<src/hal/buttons_hal.cpp>
    -<src/hal/encoder_hal.cpp>
    +<src/hal/hal.cpp>
    -<src/hal/tft_manager.cpp>
    -<src/hal/tft_status_bar.cpp>
    -<src/hal/tft_clock.cpp>
    -<src/hal/tft_todo.cpp>
    -<src/hal/tft_schedule.cpp>
    -<src/navigation/nav_state.cpp>
    -<src/handlers/handlers.cpp>
    -<src/handlers/todo_handlers.cpp>
    -<src/handlers/alarm_handlers.cpp>
    -<src/handlers/schedule_handlers.cpp>
    -<src/handlers/api_response.cpp>
    -<src/server/server.cpp>
    -<main.ino>
