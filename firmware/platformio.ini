; ──────────────────────────────────────────────────────────────
; PIFKID 2026 Smart Desk Clock — PlatformIO Configuration
; ──────────────────────────────────────────────────────────────

[platformio]
src_dir = .
data_dir = ../data

; ── Production ESP32 Build ──────────────────────────────────
[env:esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.6.0
    ESP32Async/AsyncTCP@3.3.2
    bblanchon/ArduinoJson@^6.21.0
    bodmer/TFT_eSPI
    adafruit/RTClib
build_flags =
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=15
    -DSPI_FREQUENCY=40000000
    -DASYNCWEBSERVER_REGEX
    -I.
build_src_filter =
    +<main.cpp>
    +<src/**>
